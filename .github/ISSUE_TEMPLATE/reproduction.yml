name: Workflow report (browser or code)
description: Report a no-code browser walkthrough, a software run, or a useful failure.
title: '[Workflow report] '
body:
  - type: markdown
    attributes:
      value: >-
        Try the no-setup browser comparison at
        https://metivity.github.io/talk2nature/app/compare/ or follow the code
        route in https://github.com/Metivity/talk2nature/blob/main/docs/RESEARCHER_START.md.
        The browser route needs no code, account, recording or upload. This
        issue is public. Use synthetic examples only; redact personal paths. Do not attach private recordings,
        participant details, exact sensitive locations, credentials or environment files.
        Passing software checks is not biological validation.
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship to this run
      description: >-
        This records project assistance, not scientific validation. An independent
        walkthrough is not automatically a software reproduction. Use the unverified
        option unless you can classify the run accurately; maintainers review reports
        before counting any independent reproduction.
      options:
        - Not sure / not independently verified
        - Independent evaluator (no project or maintainer assistance)
        - Evaluator with maintainer assistance
        - Maintainer or project-assisted rerun
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Which page or code version did you try?
      description: For the browser route, paste the public page URL and date. For a code run, use git rev-parse HEAD. Do not include tokens or local paths.
      placeholder: Public page URL + date, or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: What device and browser did you use?
      description: For the browser route, give the device, operating system and browser if known. For code, include Python or Node version. If unsure, write “unknown.”
      placeholder: e.g. iPhone + Safari; unknown is okay
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you try, and what happened?
      description: Include the commands or screen actions, what you expected, what actually happened, and any help needed. A blocked attempt is useful.
      placeholder: e.g. opened Compare moments → chose Try an example pair → closed one session
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: What task were you trying to do, and what was missing?
      description: Say what helped, what was confusing, and which existing tool already works for you. Do not include confidential study details.
      placeholder: I was trying to… The useful part was… I still needed…
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This report contains no private media, participant details, credentials or sensitive locations.
          required: true
