name: Scientific methods review
description: Review a specific scientific claim, evaluation design, or interpretation.
title: "[Methods review] "
body:
  - type: markdown
    attributes:
      value: |
        Public issue: do not include recordings, raw annotations, participant or animal identifiers, private correspondence, unpublished material, credentials, or sensitive locations. A review is not an endorsement or partnership.
  - type: input
    id: review-target
    attributes:
      label: Candidate, claim, or decision you are reviewing
      description: No first benchmark is selected. Name one bounded question or artifact, such as OpenWhistle dolphin whistle detection/type classification, bat interaction-context prediction, zebra-finch turn-taking, zebra-finch call-perception comparison, V33DA caller attribution, or Great Tit song structure.
      placeholder: The specific question or decision I reviewed is…
    validations:
      required: true
  - type: input
    id: source-version
    attributes:
      label: Exact source and version reviewed
      description: Give the DOI, URL, version/date, and any artifact revision.
      placeholder: DOI or stable URL; version/date
    validations:
      required: true
  - type: textarea
    id: review-locator
    attributes:
      label: Sections, tables, code, or artifacts you reviewed
      description: Say what you actually inspected. It is fine to review only one part or to say an artifact was unavailable.
    validations:
      required: true
  - type: textarea
    id: relevant-expertise
    attributes:
      label: Relevant expertise (optional)
      description: A short description is enough; affiliation and contact details are optional.
    validations:
      required: false
  - type: textarea
    id: conflict-disclosure
    attributes:
      label: Authorship, relevant relationships, and conflicts
      description: Say whether you authored a reviewed source, work with its authors or Talk2Nature, or have a relevant financial or other interest. Write “none known” or “unable to assess” if applicable. Keep it brief; do not include private contact details.
      placeholder: No known relevant conflicts; I reviewed the public source and have no relevant collaboration or financial interest.
    validations:
      required: true
  - type: checkboxes
    id: review-scope
    attributes:
      label: What can you assess?
      options:
        - label: Scientific question and intended generalization
        - label: Animal, pair, group, session, or recording split design
        - label: Leakage, confounding, or metadata requirements
        - label: Baselines, metrics, or uncertainty estimates
        - label: Interpretation and limits of the biological claim
        - label: Rights or provenance questions (not legal advice)
  - type: textarea
    id: judgment
    attributes:
      label: Your assessment and reasoning
      description: Supported, partly supported, unclear, not supported, or cannot assess. Explain why and cite a precise source locator.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Most important alternative explanation or risk
      description: For example, an unverified grouping boundary, context label limitation, recording-condition confound, or unavailable artifact.
    validations:
      required: true
  - type: textarea
    id: follow-up
    attributes:
      label: Smallest useful next check
      description: Name one bounded check, its required artifact, and what result would change your assessment. Do not attach or request private data here.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Additional public sources (optional)
      description: Prefer stable primary sources. State the relevant section or version.
    validations:
      required: false
  - type: checkboxes
    id: public-safety
    attributes:
      label: Public issue check
      options:
        - label: I have included no recordings, raw participant data, private/unpublished material, credentials, personal contact details, or sensitive locations.
          required: true
