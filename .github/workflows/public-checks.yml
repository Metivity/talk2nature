name: Public checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository checks
        run: python3 -m unittest discover -s tests -v
      - name: Browser-tool logic checks
        run: node --test tests/*.test.mjs
      - name: Native Android station checks
        run: |
          bash native-android/scripts/test-core.sh
          cd native-android
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:assembleRelease
          cd ..
          bash native-android/scripts/check-release-boundaries.sh
      - name: Check the preview site
        run: |
          python3 web/build.py
          python3 scripts/check_site.py
