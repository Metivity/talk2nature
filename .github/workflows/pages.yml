name: Publish Talk2Nature

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the configured Pages origin
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node.js 24)
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Test the public tools and demo workflow
        run: node --test tests/*.test.mjs
      - name: Build public website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 web/build.py --public --base-url "$SITE_URL" --repo-url "$REPO_URL"
      - name: Check links, SEO metadata and publish boundaries
        run: python3 scripts/check_site.py
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node.js 24 artifact dependency)
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the live-site verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node.js 24)
      - name: Verify live routes and crawl metadata
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_live_site.py --base-url "$DEPLOYMENT_URL"
