<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Talk2Nature — listen closely, learn carefully</title>
  <desc id="desc">Open research tools for observing the living world, represented by a soft green signal field and connected acoustic rings.</desc>
